models:
  - name: stg_steamspy_all
    description: >
      Deduplicated SteamSpy snapshot versions: one row per unique
      (appid, row_hash) pair, so repeated observations of the same state collapse
      while changed ones remain as separate versions.
    columns:
      - name: appid
        description: 'Steam application identifier.'
      - name: name
        description: 'Game title.'
      - name: developer
        description: 'Developer studio.'
      - name: publisher
        description: 'Publisher.'
      - name: score_rank
        description: 'Score rank, almost always empty in SteamSpy.'
      - name: positive
        description: 'Number of positive reviews.'
      - name: negative
        description: 'Number of negative reviews.'
      - name: userscore
        description: 'Legacy user score, almost always 0.'
      - name: owners
        description: 'Estimated owners as a range string.'
      - name: price
        description: 'Current price in cents.'
      - name: initialprice
        description: 'Original price in cents.'
      - name: discount
        description: 'Discount, percent.'

  - name: stg_steampower_appid
    description: >
      Deduplicated appid catalog from the Steam store search: one row per unique
      (appid, row_hash) pair. Three DAGs feed the raw table with different slices
      of the same catalog, so a game can arrive from any of them; the dedup makes
      that invisible downstream.
    columns:
      - name: appid
        description: 'Steam application identifier.'
      - name: name
        description: 'Game title as returned for l=en.'
      - name: row_hash
        description: 'Row hash over appid and name, used to detect renames.'
      - name: last_update
        description: 'When this state was first seen.'

  - name: stg_steampower_specials
    description: >
      Daily membership of the discounted set: one row per game per day it was
      seen on sale. This is an observation log, so a game appears as many times
      as it had discounted days - unlike the catalog, where repeats collapse.
    columns:
      - name: appid
        description: 'Steam application identifier.'
      - name: name
        description: 'Game title as returned for l=en.'
      - name: row_hash
        description: 'Row hash over appid and name.'
      - name: last_update
        description: 'Exact observation timestamp within the day.'

  - name: stg_steampower_active_users
    description: >
      Hourly concurrent player counts: one row per game per hour it was polled.
      This is an observation log, so a game appears as many times as it was
      measured - unlike the catalog, where repeats collapse. Repeated polls
      within the same hour that return the same count collapse to one row.
    columns:
      - name: appid
        description: 'Steam application identifier.'
      - name: name
        description: 'Game title.'
      - name: player_count
        description: 'Players in game at the moment of the poll.'
      - name: row_hash
        description: 'Row hash over appid, name and player_count.'
      - name: last_update
        description: 'Exact observation timestamp within the hour.'

  - name: stg_steampower_appdetails
    description: >
      Deduplicated per-game cards: one row per unique (appid, row_hash) pair, so
      an unchanged card collapses while every edit of the store page stays as its
      own version. Rows with success = 0 are kept: the card was unreachable at
      that moment, which is itself an observation.
    columns:
      - name: success
        description: 'False when appdetails returned no data (delisted or region-blocked).'
      - name: appid
        description: 'Steam application identifier.'
      - name: name
        description: 'Game title as returned for l=en.'
      - name: required_age
        description: 'Age gate declared by the publisher; 0 when none is set.'
      - name: is_free
        description: 'Whether the store price is zero, which separates free-to-play from premium.'
      - name: dlc
        description: >
          Appids of the add-ons sold on top of this game; its length is the add-on
          count. Bundle editions list none, because their expansions are included.
      - name: supported_languages
        description: 'Language list as an HTML string, with asterisks marking full audio support.'
      - name: website
        description: 'Official site of the game.'
      - name: pc_requirements
        description: 'Minimum PC requirements as an HTML string.'
      - name: mac_requirements
        description: 'Minimum Mac requirements as an HTML string.'
      - name: linux_requirements
        description: 'Minimum Linux requirements as an HTML string.'
      - name: developers
        description: 'Studios credited with development.'
      - name: publishers
        description: 'Publishers of the game.'
      - name: categories_id
        description: 'Steam category identifiers, e.g. multiplayer or controller support.'
      - name: categories_description
        description: 'Category labels; the In-App Purchases one marks games monetised inside.'
      - name: genres_id
        description: 'Steam genre identifiers set by the publisher, not by players.'
      - name: genres_description
        description: 'Genre labels set by the publisher; compare with apptag to see perception.'
      - name: release_date
        description: 'Release date; empty for announced games whose date Steam gives as text.'
      - name: row_hash
        description: 'Row hash over the card fields, used to detect changes.'
      - name: last_update
        description: 'When this card state was first seen.'

  - name: stg_steampower_dlc_details
    description: >
      Deduplicated add-on cards: one row per unique (appid, dlc_appid, row_hash)
      triple. Grain is one row per add-on per distinct state. Filter on type before
      counting add-ons - soundtracks share the dlc array with content.
    columns:
      - name: appid
        description: 'Steam application identifier of the parent game.'
      - name: dlc_appid
        description: 'Steam application identifier of the add-on itself.'
      - name: dlc_name
        description: 'Add-on title as returned for l=en.'
      - name: type
        description: "Steam item type: 'dlc' for content, 'music' for soundtracks."
      - name: is_free
        description: 'Whether the add-on is free, which tells a missing price from a failed fetch.'
      - name: release_date
        description: >
          Release date of the add-on; against the game release date it gives the
          time to first add-on and the cadence of later ones.
      - name: platform_windows
        description: 'Whether the add-on runs on Windows.'
      - name: platform_mac
        description: 'Whether the add-on runs on macOS.'
      - name: platform_linux
        description: 'Whether the add-on runs on Linux.'
      - name: row_hash
        description: 'Row hash over the add-on fields, used to detect changes.'
      - name: last_update
        description: 'When this add-on state was first seen.'

  - name: stg_steampower_dlc_price
    description: >
      Daily price observations of add-ons: one row per add-on per day its price was
      seen. Summed against the base game price, it gives the true cost of owning
      everything; for free-to-play titles it is the main visible revenue signal.
    columns:
      - name: appid
        description: 'Steam application identifier of the parent game.'
      - name: dlc_appid
        description: 'Steam application identifier of the add-on itself.'
      - name: currency
        description: 'Currency of the prices, decided by the country the request used.'
      - name: price_initial
        description: 'Price before discount, in cents.'
      - name: price_final
        description: 'Price after discount, in cents.'
      - name: discount_percent
        description: 'Discount, percent.'
      - name: row_hash
        description: 'Row hash over currency and the price fields.'
      - name: last_update
        description: 'Exact observation timestamp within the day.'

  - name: stg_steampower_dlc_packages
    description: >
      Deduplicated purchase options of add-ons: one row per unique
      (appid, dlc_appid, packageid, row_hash). Grain is one row per package, not
      per add-on.
    columns:
      - name: appid
        description: 'Steam application identifier of the parent game.'
      - name: dlc_appid
        description: 'Steam application identifier of the add-on itself.'
      - name: packageid
        description: 'Steam package identifier.'
      - name: package_option_text
        description: 'Label of the purchase option as shown in the store.'
      - name: package_price_with_discount
        description: 'Price of the package after discount, in cents.'
      - name: row_hash
        description: 'Row hash over the package fields.'
      - name: last_update
        description: 'When this package state was first seen.'

  - name: stg_steampower_apptag
    description: >
      Deduplicated user tags: one row per unique (appid, row_hash) pair, so an
      unchanged tag collapses while every change in its vote count stays as its
      own version. The grain is one row per game per tag, not per game.
    columns:
      - name: appid
        description: 'Steam application identifier.'
      - name: tagid
        description: 'Steam tag identifier, stable across games.'
      - name: tag_name
        description: 'Tag label as returned for l=en.'
      - name: count
        description: 'Number of players who voted for this tag on this game.'
      - name: browseable
        description: 'Whether the tag has a store browse page, i.e. whether it drives discovery.'
      - name: row_hash
        description: 'Row hash over the tag fields, used to detect changes.'
      - name: last_update
        description: 'When this tag state was first seen.'

  - name: stg_steampower_appreviews
    description: >
      Deduplicated review summaries: one row per unique (appid, row_hash) pair,
      so repeated observations of an unchanged summary collapse while every
      change in the review counts stays as its own version.
    columns:
      - name: appid
        description: 'Steam application identifier.'
      - name: review_score
        description: 'Steam review score, 0-9.'
      - name: review_score_desc
        description: 'Human-readable label of the score, e.g. "Very Positive".'
      - name: total_positive
        description: 'Number of positive reviews at the moment of the observation.'
      - name: total_negative
        description: 'Number of negative reviews at the moment of the observation.'
      - name: total_reviews
        description: 'Total number of reviews at the moment of the observation.'
      - name: row_hash
        description: 'Row hash over the review fields, used to detect changes.'
      - name: last_update
        description: 'When this summary state was first seen.'

  - name: stg_steampower_appreviews_details
    description: >
      Deduplicated individual reviews: one row per unique (appid, row_hash) pair.
      The grain is one row per review version, not per review - an edited review
      keeps its original timestamp_created and arrives as an additional row, so
      the table holds the edit history. Since no identity field is stored,
      (appid, timestamp_created) is what groups the versions of one review.
    columns:
      - name: appid
        description: 'Steam application identifier.'
      - name: timestamp_created
        description: 'When the review was first published; unchanged by later edits.'
      - name: timestamp_updated
        description: 'When the review was last edited; equal to timestamp_created if never edited.'
      - name: voted_up
        description: 'Whether the review recommends the game.'
      - name: language
        description: 'Language the review was written in.'
      - name: steam_purchase
        description: 'Whether the reviewer bought the game on Steam rather than activating a key.'
      - name: received_for_free
        description: 'Whether the reviewer got the game for free.'
      - name: written_during_early_access
        description: 'Whether the review was written while the game was in Early Access.'
      - name: refunded
        description: 'Whether the reviewer later refunded the game.'
      - name: primarily_steam_deck
        description: 'Whether the reviewer played mostly on Steam Deck.'
      - name: playtime_at_review
        description: 'Minutes played when the review was written; trust it only where timestamp_updated equals timestamp_created.'
      - name: playtime_forever
        description: 'Minutes played in total at the moment of the observation.'
      - name: playtime_last_two_weeks
        description: 'Minutes played in the two weeks before the observation.'
      - name: last_played
        description: 'When the reviewer last launched the game.'
      - name: row_hash
        description: 'Row hash over the review fields, used to detect edits.'
      - name: last_update
        description: 'When this review state was first seen.'
