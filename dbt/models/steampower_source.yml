sources:
  - name: steampower
    schema: raw
    description: 'Raw Steam Store layer, loaded by Airflow.'
    tables:
      - name: steampower_appid
        description: >
          Appid catalog from the store search (/search/results/). Three DAGs feed
          it with different slices: the full Name_ASC crawl, the daily
          Released_DESC pages, and the discounted set. ReplacingMergeTree over
          (appid, row_hash) collapses repeated observations of the same state.
        columns:
          - name: appid
            description: 'Steam application identifier.'
          - name: name
            description: 'Game title as returned for l=en.'
          - name: row_hash
            description: 'Row hash over every column except last_update, used to detect changes.'
          - name: last_update
            description: 'When this state was first seen.'

      - name: steampower_specials
        description: >
          Daily membership of the discounted set, from the store search with
          specials=1. Unlike steampower_appid this is an observation log, not a
          catalog: the date is part of the sorting key, so the same game gives one
          row per day it was on sale. ReplacingMergeTree over
          (toDate(last_update), appid, row_hash) makes a re-run of the same day
          idempotent.
        columns:
          - name: appid
            description: 'Steam application identifier.'
          - name: name
            description: 'Game title as returned for l=en, carried along so the row reads without a join.'
          - name: row_hash
            description: 'Row hash over appid and name.'
          - name: last_update
            description: 'Observation timestamp; its date is what makes the row unique per day.'

      - name: steampower_appdetails
        description: >
          Per-game card from store /api/appdetails. Slow-changing: descriptions,
          developers, genres, categories, release date. ReplacingMergeTree over
          (appid, row_hash) keeps one row per distinct card state.
        columns:
          - name: appid
            description: 'Steam application identifier.'
          - name: success
            description: 'False when appdetails returned no data (delisted or region-blocked).'
          - name: row_hash
            description: 'Row hash over the card fields, used to detect changes.'
          - name: last_update
            description: 'When this card state was first seen.'

      - name: steampower_price
        description: >
          Price observations from appdetails price_overview. The date is part of
          the sorting key, so the same game gives one row per day its price was
          seen - this is the price history contour, separate from the slow card.
        columns:
          - name: appid
            description: 'Steam application identifier.'
          - name: row_hash
            description: 'Row hash over currency and the price fields.'
          - name: last_update
            description: 'Observation timestamp; its date makes the row unique per day.'

      - name: steampower_apptag
        description: >
          User tags scraped from the store page, one row per game per tag. Unlike
          genres and categories, which the publisher sets, tags are voted on by
          players - so count carries the weight of the claim. ReplacingMergeTree
          over (appid, row_hash) keeps one row per distinct state of a tag, which
          makes the table the vote history rather than a snapshot.
        columns:
          - name: appid
            description: 'Steam application identifier.'
          - name: tagid
            description: 'Steam tag identifier, stable across games.'
          - name: tag_name
            description: 'Tag label as returned for l=en.'
          - name: count
            description: 'Number of players who voted for this tag on this game.'
          - name: browseable
            description: 'Whether the tag has a store browse page, i.e. whether it drives discovery.'
          - name: row_hash
            description: 'Row hash over the tag fields, used to detect changes.'
          - name: last_update
            description: 'When this tag state was first seen.'

      - name: steampower_appreviews
        description: >
          Review summary per game from the store review endpoint: score, its
          label, and the positive/negative/total counts. ReplacingMergeTree over
          (appid, row_hash) keeps one row per distinct summary state, so the
          table doubles as the review growth contour - counts change on almost
          every observation, while a stale game collapses to a single row.
        columns:
          - name: appid
            description: 'Steam application identifier.'
          - name: review_score
            description: 'Steam review score, 0-9.'
          - name: review_score_desc
            description: 'Human-readable label of the score, e.g. "Very Positive".'
          - name: total_positive
            description: 'Number of positive reviews at the moment of the observation.'
          - name: total_negative
            description: 'Number of negative reviews at the moment of the observation.'
          - name: total_reviews
            description: 'Total number of reviews at the moment of the observation.'
          - name: row_hash
            description: 'Row hash over the review fields, used to detect changes.'
          - name: last_update
            description: 'When this summary state was first seen.'

      - name: steampower_active_users
        description: >
          Concurrent player counts from GetNumberOfCurrentPlayers. An observation
          log rather than a catalog: the hour is part of the sorting key, so the
          same game gives one row per hour it was polled. ReplacingMergeTree over
          (toStartOfHour(last_update), appid, row_hash) makes a re-run within the
          same hour idempotent.
        columns:
          - name: appid
            description: 'Steam application identifier.'
          - name: name
            description: 'Game title, carried along so the row reads without a join.'
          - name: player_count
            description: 'Players in game at the moment of the poll.'
          - name: row_hash
            description: 'Row hash over appid, name and player_count.'
          - name: last_update
            description: 'Observation timestamp; its hour is what makes the row unique per poll.'

      - name: steampower_packages
        description: >
          Editions (subs) of a game from appdetails package_groups. One row per
          package, so packageid is part of the key. ReplacingMergeTree over
          (appid, packageid, row_hash).
        columns:
          - name: appid
            description: 'Steam application identifier.'
          - name: packageid
            description: 'Steam package (edition) identifier.'
          - name: row_hash
            description: 'Row hash over the package fields.'
          - name: last_update
            description: 'When this package state was first seen.'
