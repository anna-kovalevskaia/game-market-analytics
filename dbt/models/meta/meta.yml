models:

  - name: appid_fetch_details
    description: >
      Queue of appids that need their appdetails fetched next, recomputed on every
      read - there is no stored cursor. Two branches: games never fetched (anti-join
      against the details table, capped at 2000, oldest first), and discounted games
      whose sale status changed today (appear once, or resume after a gap). A game
      that failed with success=false is treated as fetched so it does not loop.
    columns:
      - name: appid
        description: 'Steam application identifier to fetch next.'
