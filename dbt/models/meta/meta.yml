models:
  - name: appid_state
    description: >
      Current state of every game: the hash of its latest known snapshot and when
      that state last changed. Drives the selection of appids that need an
      appdetails refetch.
    columns:
      - name: appid
        description: 'Steam application identifier, the table key.'
        tests:
          - not_null
          - unique
      - name: row_hash_cur
        description: 'Row hash of the latest known state of the game.'
      - name: is_changed
        description: >
          Flag marking that the run_date snapshot differed from the stored state,
          i.e. the game changed on that run.
        tests:
          - not_null
      - name: last_changed
        description: 'Timestamp of the snapshot in which the state last changed.'
